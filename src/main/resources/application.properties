spring.application.name=dolcevit
server.port=8093
spring.datasource.url=jdbc:mysql://localhost:3306/pasteleriaweb
spring.datasource.username=root
spring.datasource.password=1234
logging.level.org.springframework.security=INFO
server.servlet.session.timeout=8h
logging.level.com.example=INFO
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.nombre=DOLCEVITA
info.app.descripcion=Sistema de reservas y entregas de pasteleria
info.app.version=1.0.0
mantenimiento.backups.carpeta=backups
mantenimiento.backups.dias-retencion=15
mantenimiento.mysql-bin=
mantenimiento.cron.backup=0 0 8 * * *
mantenimiento.cron.revision=0 0 8 * * *
mantenimiento.cron.limpieza=0 30 3 * * SUN
mantenimiento.cron.verificacion=0 0 * * * *
