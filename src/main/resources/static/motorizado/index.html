<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis entregas | DOLCEVITA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="motorizado.css">
</head>
<body class="moto-body">
<header class="moto-barra">
    <button class="moto-icono moto-atras" id="btnVolver" type="button" aria-label="Volver"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="moto-marca"><b>DOLCEVITA</b><small>Pastelería · Entregas</small></div>
    <button class="moto-icono" id="btnSalir" type="button" aria-label="Cerrar sesión" title="Cerrar sesión"><i class="fa-solid fa-right-from-bracket"></i></button>
</header>
<main class="moto-app">
    <section class="moto-lista">
        <p class="moto-saludo" id="saludo"></p>
        <div class="moto-tabs">
            <button type="button" class="activo" data-tab="activas">Mis entregas</button>
            <button type="button" data-tab="historial">Historial</button>
        </div>
        <p class="moto-fecha" id="fechaHoy"></p>
        <div id="tarjetas" class="moto-tarjetas"><p class="moto-mensaje">Cargando entregas...</p></div>
    </section>
    <section class="moto-panel" id="panel">
        <div class="moto-vacio"><i class="fa-solid fa-motorcycle"></i><p>Selecciona una entrega para ver su detalle.</p></div>
    </section>
</main>
<div class="moto-toast" id="toast" hidden></div>
<script src="../js/api.js"></script>
<script src="motorizado.js"></script>
</body>
</html>
